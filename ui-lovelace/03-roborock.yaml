      - template: vacuum_clean_zone
    tiles:
      # Status tiles
      - label: Status
        entity: vacuum.medor
        icon: mdi:robot-vacuum
        order: 1
        
      - label: Battery
        entity: sensor.medor_battery
        unit: '%'
        icon: mdi:battery
        order: 2
        
      - label: Cleaning progress
        entity: sensor.medor_cleaning_progress
        icon: mdi:progress-check
        unit: '%'
        order: 3
        
      # # Cleaning stats
      - label: Cleaned
        entity: sensor.medor_cleaning_area
        unit: 'm²'
        icon: mdi:map-marker-check
        order: 4
        
      - label: Fan Speed
        entity: vacuum.medor
        attribute: fan_speed
        icon: mdi:fan
        order: 5
        
      # # Mop controls
      - label: Mop Mode
        entity: select.medor_mop_mode
        icon: mdi:water
        order: 6
        
      - label: Mop Intensity
        entity: select.medor_mop_intensity
        icon: mdi:water-percent
        order: 7
        
      - label: Water Tank
        entity: binary_sensor.medor_water_shortage
        icon: mdi:water-outline
        order: 8
        
      # # Maintenance
      - label: Filter change
        entity: sensor.medor_filter_time_left
        icon: mdi:air-filter
        tooltip: 'Filter hours left'
        unit: 'h'
        precision: 0
        order: 9
        
      - label: Main Brush change
        entity: sensor.medor_main_brush_time_left
        icon: mdi:brush
        unit: 'h'
        precision: 0
        order: 10
        
      - label: Side Brush change
        entity: sensor.medor_side_brush_time_left
        icon: mdi:brush-variant
        unit: 'h'
        precision: 0
        order: 11
        
      - label: Sensors change
        entity: sensor.medor_sensor_time_left
        icon: mdi:circle-slice-3
        unit: 'h'
        precision: 0
        order: 12

        

