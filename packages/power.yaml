###############################################################
# Automation
###############################################################

automation:
  # ------------------ Economie Energie ------------------
  - alias: Economie Energie
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.maison
        to: "armed_away"
      - trigger: state
        entity_id: alarm_control_panel.maison
        to: armed_night
    condition:
      - condition: template
        value_template: "{{ is_state_attr('remote.harmony_hub', 'current_activity', 'PowerOff') }}"
    action:
      - action: switch.turn_off
        entity_id: switch.tuya_tv
      - action: switch.turn_off
        entity_id: switch.tuya_ordi

  - alias: Reveil economie energie
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.maison
        to: "disarmed"
    action:
      - action: switch.turn_on
        entity_id: switch.tuya_ordi

  - alias: Reveil economie energie TV
    trigger:
      - trigger: state
        entity_id: remote.harmony_hub
        attribute: current_activity
        from: "PowerOff"
    condition:
      - condition: state
        entity_id: switch.tuya_tv
        state: "off"
    action:
      - action: switch.turn_on
        entity_id: switch.tuya_tv

  # ------------------ Start ------------------
  - alias: Debut lave linge
    trigger:
      - platform: numeric_state
        entity_id: sensor.tuya_power_sdb_wash_power
        above: 30
    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.lave_linge_on

  - alias: Debut seche linge
    trigger:
      - platform: numeric_state
        entity_id: sensor.tuya_power_sdb_dry_power
        above: 500
    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.seche_linge_on

  - alias: Debut lave vaisselle
    trigger:
      - platform: numeric_state
        entity_id: sensor.tuya_power_cuisine_power
        above: 10
    action:
      - service: input_boolean.turn_on
        data:
          entity_id: input_boolean.lave_vaisselle_on

  # ------------------ End ------------------

  - alias: Fin lave linge
    trigger:
      - platform: numeric_state
        entity_id: sensor.tuya_power_sdb_wash_power
        below: 5
        for:
          minutes: 3
    action:
      - service: input_boolean.turn_off
        data:
          entity_id: input_boolean.lave_linge_on

  - alias: Fin seche linge
    trigger:
      - platform: numeric_state
        entity_id: sensor.tuya_power_sdb_dry_power
        below: 5
        for:
          minutes: 3
    action:
      - service: input_boolean.turn_off
        data:
          entity_id: input_boolean.seche_linge_on

  - alias: Fin lave vaisselle
    trigger:
      - platform: numeric_state
        entity_id: sensor.tuya_power_cuisine_power
        below: 5
        for:
          minutes: 20
    action:
      - service: input_boolean.turn_off
        data:
          entity_id: input_boolean.lave_vaisselle_on

  # ------------------ Annonces ------------------
  - alias: Annonce fin lave linge
    trigger:
      - trigger: state
        entity_id: input_boolean.lave_linge_on
        to: "off"
    condition:
      - condition: not
        conditions:
          - condition: time
            after: "23:00:00"
            before: "07:00:00"
    action:
      - action: notify.send_message
        data:
          message: Le lave linge est terminé
        target:
          entity_id: notify.echo_salon_speak
      - alias: ""
        data:
          message: Le lave linge est terminé
          title: Fin de machine
        service: notify.mobile_app_iphone_amadeus

  - alias: Annonce fin seche linge
    trigger:
      - trigger: state
        entity_id: input_boolean.seche_linge_on
        to: "off"
    condition:
      - condition: not
        conditions:
          - condition: time
            after: "23:00:00"
            before: "07:00:00"
    action:
      - action: notify.send_message
        data:
          message: Le sèche linge est terminé
        target:
          entity_id: notify.echo_salon_speak
      - alias: ""
        data:
          message: Le sèche linge est terminé
          title: Fin de machine
        service: notify.mobile_app_iphone_amadeus

  - alias: Annonce fin lave vaisselle
    trigger:
      - trigger: state
        entity_id: input_boolean.lave_vaisselle_on
        to: "off"
    condition:
      - condition: not
        conditions:
          - condition: time
            after: "23:00:00"
            before: "07:00:00"
    action:
      - action: notify.send_message
        data:
          message: Le lave vaisselle est terminé
        target:
          entity_id: notify.echo_salon_speak
      - alias: ""
        data:
          message: Le lave vaisselle est terminé
          title: Fin de machine
        service: notify.mobile_app_iphone_amadeus

  # ------------------ Bugs ------------------
  - alias: Bug power
    trigger:
      - trigger: state
        entity_id: switch.tuya_power_sdb_dry
        to: "off"
      - trigger: state
        entity_id: switch.tuya_power_sdb_wash
        to: "off"
      - trigger: state
        entity_id: switch.tuya_power_cuisine
        to: "off"
    action:
      - service: switch.turn_on
        entity_id: switch.tuya_power_cuisine
      - service: switch.turn_on
        entity_id: switch.tuya_power_sdb_wash
      - service: switch.turn_on
        entity_id: switch.tuya_power_sdb_dry

  # ------------------ Moustiques ------------------

  - alias: Allumer la prise antimoustiques
    mode: single
    description: Allume la prise antimoustiques
    trigger:
      - platform: time
        at: "12:00:00"
      - platform: time
        at: "17:00:00"
      - platform: time
        at: "19:30:00"
      - platform: time
        at: "22:00:00"
    action:
      - action: switch.turn_on
        target:
          entity_id:
            - switch.tuya_moustiques
            - switch.tuya_moustiques_cleo
      - delay: "01:00:00" # attend 2h
      - action: switch.turn_off
        target:
          entity_id:
            - switch.tuya_moustiques
            - switch.tuya_moustiques_cleo
