###############################################################
# Sensors
###############################################################

template:
  - sensor:
      - unit_of_measurement: °C
        default_entity_id: sensor.temperature_cleo
        icon: mdi:thermometer
        name: Température Cléo
        state: "{{ states('sensor.xiaomi_temp_cleo_temperature') | round(1) }}"
      - default_entity_id: sensor.temperature_salon
        name: Température Salon
        unit_of_measurement: "°C"
        state: "{{ states('sensor.xiaomi_temp_sam_temperature') | round(1) }}"
        icon: "mdi:thermometer"
      - default_entity_id: sensor.temperature_cuisine
        name: Température Cuisine
        unit_of_measurement: "°C"
        state: "{{ states('sensor.xiaomi_temp_cuisine_temperature') | round(1) }}"
        icon: "mdi:thermometer"
      - default_entity_id: sensor.temperature_sdb
        name: Température salle de bain
        unit_of_measurement: "°C"
        state: "{{ states('sensor.xiaomi_temp_sdb_temperature') | round(1) }}"
        icon: "mdi:thermometer"
      - default_entity_id: sensor.temperature_chambre
        name: Température chambre
        unit_of_measurement: "°C"
        state: "{{ states('sensor.xiaomi_temp_chambre_temperature') | round(1) }}"
        icon: "mdi:thermometer"
      - default_entity_id: sensor.temperature_exterieure
        name: Température extérieure
        unit_of_measurement: "°C"
        state: "{{ ((states.weather.nice.attributes.temperature)) | float }}"
        icon: "mdi:thermometer"
