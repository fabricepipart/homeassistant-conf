###############################################################
# Automation
###############################################################
automation:
  - alias: Appel Cleo
    trigger:
      - trigger: state
        entity_id: sensor.xiaomi_cleo_up_action
        to: "hold"
    action:
      - service: notify.mobile_app_iphone_amadeus
        data:
          push:
            interruption-level: time-sensitive
          message: Appel passé depuis son lit
          title: Cléo aimerait passer un message
      - action: notify.send_message
        target:
          entity_id:
            - notify.partout_announce
        data:
          message: Cléo aimerait passer un message
