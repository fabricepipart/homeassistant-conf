  #         entity_id: remote.appletv

  - alias: Allumer AppleTV sans Harmony
    trigger:
      - trigger: state
        entity_id: media_player.appletv
        to: "idle"
      - trigger: state
        entity_id: media_player.appletv
        to: "paused"
    condition:
      - condition: state
        entity_id: switch.appletv
        state: "off"
        for:
          seconds: 20
      - condition: state
        entity_id: switch.tuya_tv
        state: "on"
        for:
          minutes: 1
    action:
      - action: switch.turn_on
        target:
          entity_id: switch.appletv

  - alias: Allumage initial Home Cinema
    trigger:
      - trigger: state
        entity_id: switch.tuya_tv
        from: "off"
        to: "on"
    action:
      - action: switch.turn_on
        target:
          entity_id: switch.appletv
      - delay: "00:00:10"
      - action: remote.send_command
        target:
          entity_id: remote.harmony_hub
        data:
          command: PowerOn
          device: 71869520
      - delay: "00:00:10"
      - action: remote.send_command
        target:
          entity_id: remote.harmony_hub
        data:
          command: PowerToggle
          device: 71869520

  # - alias: Eteindre AppleTV (boot)
  #   trigger:
  #     - trigger: state
  #       entity_id: media_player.appletv
  #       to: "idle"
  #   condition:
  #     condition: not
  #     conditions:
  #       - condition: state
  #         entity_id: switch.tuya_tv
  #         state: "on"
  #         for:
  #           minutes: 1
  #   action:
  #     - action: media_player.turn_off
  #       target:
  #         entity_id: media_player.appletv

  - alias: Eteindre AppleTV sans Harmony
    trigger:
      - trigger: state
        entity_id: media_player.appletv
        to: "standby"
      - trigger: state
        entity_id: media_player.appletv
        to: "off"
    condition:
      - condition: state
        entity_id: switch.appletv
        state: "on"
        for:
          seconds: 20
    action:
      - action: switch.turn_off
        target:
          entity_id: switch.appletv

  - alias: Eteindre AppleTV si Harmony Off
    trigger:
      - trigger: state
        entity_id: switch.appletv
        to: "off"
        for: "00:00:05"
    condition:
      - condition: state
        entity_id: media_player.appletv
        state: "idle"
    action:
      - action: media_player.turn_off
        target:
          entity_id: media_player.appletv

  # - alias: Eteindre AppleTV apres Harmony
  #   trigger:
  #     - trigger: state
  #       entity_id: select.harmony_hub_activities
  #       to: "off"
  #       for: "00:00:15"
  #   condition:
  #     - condition: state
  #       entity_id: media_player.appletv
  #       state: "on"
  #   action:
  #     - action: remote.turn_off
  #       data:
  #         entity_id: remote.appletv

  - alias: Eteindre Home Cinéma
    trigger:
      - trigger: state
        entity_id: sensor.xiaomi_sam_action
        to: "hold_right"
    action:
      - action: remote.turn_on
        data:
          entity_id: remote.harmony_hub
          activity: "PowerOff"
      - action: light.turn_off
        entity_id: light.sonoff_salon
      - action: switch.turn_off
        entity_id: switch.tuya_tv

  - alias: Switch Home Cinéma
    trigger:
      - trigger: state
        entity_id: sensor.xiaomi_sam_action
        to: "double_right"
    action:
      - entity_id: switch.tuya_tv
        action: switch.toggle

  # - alias: TV ready
  #   trigger:
  #     - trigger: state
  #       entity_id: media_player.sony_bravia_tv
  #       to: "on"
  #   condition:
  #     - condition: template
  #       value_template: "{{ is_state_attr('remote.harmony_hub', 'current_activity', 'PowerOff') }}"
  #   action:
  #     - action: media_player.turn_off
  #       target:
  #         entity_id: media_player.sony_bravia_tv
  #     - delay: "00:00:05"
  #     - action: media_player.play_media
  #       target:
  #         entity_id: media_player.echo_salon
  #       data:
  #         media_content_type: sound
  #         #          media_content_id: amzn_sfx_rooster_crow_01
  #         media_content_id: amzn_sfx_cat_meow_1x_01

  - alias: Son Netflix
    triggers:
      - trigger: template
        value_template: "{{ state_attr('media_player.rx_v475','source')  }}"
    condition:
      - condition: state
        entity_id: media_player.tele
        state: "on"
      - condition: state
        entity_id: media_player.rx_v475
        state: "on"
      - condition: template
        value_template: '{{ state_attr("media_player.rx_v475", "source") == "AV1" }}'
      - condition: template
        value_template: '{{ state_attr("media_player.sony_bravia_tv", "source") == "HDMI 3/ARC" }}'
    action:
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV4

  - alias: Eteindre Mac
    trigger:
      - trigger: state
        entity_id: sensor.xiaomi_sam_action
        to: "hold_left"
    action:
      - action: script.sleep_mac
      - action: light.toggle
        entity_id: light.sonoff_sam

  - alias: Yamaha allumé par erreur
    trigger:
      - entity_id: media_player.rx_v475
        trigger: state
        to: "on"
    condition:
      - condition: template
        value_template: "{{ is_state_attr('remote.harmony_hub', 'current_activity', 'PowerOff') }}"
    action:
      - action: media_player.turn_off
        data:
          entity_id: media_player.rx_v475

  - alias: TV allumée par erreur
    trigger:
      - trigger: template
        value_template: "{{ is_state_attr('remote.harmony_hub', 'current_activity', 'PowerOff') }}"
        for: "00:00:10"
    condition:
      - condition: state
        entity_id: media_player.sony_bravia_tv
        state: "on"
    action:
      - action: remote.send_command
        target:
          entity_id: remote.harmony_hub
        data:
          command: PowerOff
          device: 71869520

  - alias: Sortir maison (HiFi)
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.maison
        to: "armed_away"
      - trigger: state
        entity_id: alarm_control_panel.maison
        to: "armed_night"
    action:
      - action: switch.turn_off
        entity_id: switch.tuya_ordi
      - action: script.sleep_mac
      - action: remote.turn_on
        data:
          entity_id: remote.harmony_hub
          activity: "PowerOff"

  - alias: TV pas sur Box
    trigger:
      - trigger: template
        value_template: "{{ is_state_attr('media_player.rx_v475','source','Box') }}"
    condition:
      condition: not
      conditions:
        - condition: state
          entity_id: media_player.sony_bravia_tv
          state: "HDMI 3/ARC"
          attribute: source
    action:
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"

  - alias: TV pas sur Switch
    trigger:
      - trigger: template
        value_template: "{{ is_state_attr('media_player.rx_v475','source','PS3') }}"
    condition:
      condition: not
      conditions:
        - condition: state
          entity_id: media_player.sony_bravia_tv
          state: "HDMI 3/ARC"
          attribute: source
    action:
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"
  # - alias: Playlist on Spotify
  #   trigger:
  #     - trigger: state
  #       entity_id: sensor.xiaomi_nawak
  #       to: "hold"
  #   action:
  #     - action: media_player.play_media
  #       data:
  #         entity_id: media_player.echo_salon
  #         media_content_id: Playlist Best of
  #         media_content_type: SPOTIFY

  - alias: Switch TV chambre
    trigger:
      - trigger: state
        entity_id: sensor.xiaomi_sdb_action
        to: "double_right"
    action:
      - action: switch.toggle
        entity_id: switch.osram_tv_chambre
