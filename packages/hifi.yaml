###############################################################
# Media players
###############################################################

media_player:
  - platform: yamaha
    name: rx_v475
    host: 192.168.1.75
    source_ignore:
      - "AV3"
      - "AV5"
      - "AV6"
      - "HDMI4"
      - "HDMI5"
      - "USB"
      - "V-AUX"
      - "iPod (USB)"
    source_names:
      AUDIO: "Wii"
      AV1: "AV1"
      AV2: "CD"
      AV4: "Sony TV"
      HDMI1: "PS3"
      HDMI2: "Box"
      HDMI3: "Plex"

###############################################################
# Scripts
###############################################################

script:
  sleep_mac:
    alias: Sleep Mac
    sequence:
      - action: shell_command.sleep_mac

  bt_mac:
    alias: Bluetooth Mac
    sequence:
      - action: shell_command.bt_mac

  volume_up:
    alias: Volume Up
    sequence:
      - action: media_player.volume_set
        entity_id: media_player.rx_v475
        data_template:
          volume_level: "{{ states.media_player.rx_v475.attributes.volume_level + 0.02 }}"

  volume_down:
    alias: Volume Down
    sequence:
      - action: media_player.volume_set
        entity_id: media_player.rx_v475
        data_template:
          volume_level: "{{ states.media_player.rx_v475.attributes.volume_level - 0.02 }}"

  activity_wii:
    alias: Wii
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AUDIO
      - action: shell_command.switch_tv_component

  activity_ps3:
    alias: PS3
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: HDMI1
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"

  activity_switch:
    alias: Switch
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: HDMI1
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"

  activity_netflix:
    alias: Netflix
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV4
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"
      - action: shell_command.switch_tv_netflix

  activity_amazon:
    alias: Prime Video
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV4
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"
      - action: shell_command.switch_tv_home
      - action: shell_command.switch_tv_home
      - action: shell_command.switch_tv_right
      - action: shell_command.switch_tv_confirm

  activity_play_tv:
    alias: Play TV
    sequence:
      - action: shell_command.switch_tv_play

  activity_pause_tv:
    alias: Pause TV
    sequence:
      - action: shell_command.switch_tv_pause
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV1
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV4

  activity_youtube:
    alias: Youtube
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV4
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"
      - action: shell_command.switch_tv_youtube

  activity_youtube_kids:
    alias: Youtube Kids
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AV4
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"
      - action: shell_command.switch_tv_home
      - action: shell_command.switch_tv_home
      - action: shell_command.switch_tv_right
      - action: shell_command.switch_tv_right
      - action: shell_command.switch_tv_right
      - action: shell_command.switch_tv_right
      - action: shell_command.switch_tv_confirm

  activity_box:
    alias: Box
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: HDMI2
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"

  activity_plex:
    alias: Plex
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_on
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: HDMI3
      - action: media_player.select_source
        data:
          entity_id: media_player.sony_bravia_tv
          source: "HDMI 3/ARC"

  activity_airplay:
    alias: Airplay
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_off
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: AirPlay

  activity_spotify:
    alias: Spotify
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_off
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: Spotify

  activity_dlna:
    alias: iTunes
    sequence:
      - action: media_player.turn_on
        data:
          entity_id: media_player.rx_v475
      - action: media_player.turn_off
        data:
          entity_id: media_player.sony_bravia_tv
      - action: media_player.select_source
        data:
          entity_id: media_player.rx_v475
          source: SERVER

  activity_off:
    alias: "Off"
    sequence:
      - action: media_player.turn_off
        data:
          entity_id: media_player.sony_bravia_tv
      - delay: "00:00:03"
      - action: media_player.turn_off
        data:
          entity_id: media_player.rx_v475

